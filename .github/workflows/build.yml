name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Android Project Structure
      run: |
        # 创建标准的 Android 工程目录结构
        mkdir -p app/src/main/java/com/clover/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-xxxhdpi

        # 1. 拷贝你的网页文件到 assets 目录
        cp index.html app/src/main/assets/
        cp style.css app/src/main/assets/
        cp script.js app/src/main/assets/
        cp manifest.json app/src/main/assets/
        cp sw.js app/src/main/assets/ || true
        if [ -d "stickers" ]; then cp -r stickers app/src/main/assets/; fi

        # 2. 创建 MainActivity.java (核心 WebView 逻辑)
        cat > app/src/main/java/com/clover/app/MainActivity.java << 'EOF'
        package com.clover.app;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                
                // 开启关键权限
                webSettings.setJavaScriptEnabled(true); // 运行 JS
                webSettings.setDomStorageEnabled(true); // 支持本地存储(IndexedDB)
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setAllowFileAccessFromFileURLs(true);
                webSettings.setAllowUniversalAccessFromFileURLs(true);
                
                // 保持在 App 内跳转
                webView.setWebViewClient(new WebViewClient());
                
                // 加载本地的网页
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # 3. 创建 activity_main.xml (布局文件)
        mkdir -p app/src/main/res/layout
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent">
            <WebView
                android:id="@+id/webview"
                android:layout_width="match_parent"
                android:layout_height="match_parent" />
        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        # 4. 创建 AndroidManifest.xml (应用配置与权限)
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.clover.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="四叶草"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity android:name=".MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. 生成默认图标（为了演示，这里用纯色块，你以后可以替换）
        # (为了确保能打包，先生成一个简单的占位图标)
        base64 -d <<< "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

        # 6. 生成 Gradle 配置文件
        cat > build.gradle << 'EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat > settings.gradle << 'EOF'
        rootProject.name = "CloverApp"
        include ':app'
        EOF

        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'

        android {
            namespace 'com.clover.app'
            compileSdk 33

            defaultConfig {
                applicationId "com.clover.app"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        # 如果没有 gradle wrapper，使用系统的 gradle 构建
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Clover-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk