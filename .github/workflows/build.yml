name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK ENV
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

    - name: Generate Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/clover/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/layout
        
        cp index.html app/src/main/assets/ || true
        cp style.css app/src/main/assets/ || true
        cp script.js app/src/main/assets/ || true
        cp manifest.json app/src/main/assets/ || true
        cp sw.js app/src/main/assets/ || true
        if [ -d "stickers" ]; then cp -r stickers app/src/main/assets/; fi

        cat > app/src/main/java/com/clover/app/MainActivity.java << 'EOF'
        package com.clover.app;
        import android.app.Activity;
        import android.content.Intent;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.*;
        import android.widget.Toast;
        import androidx.appcompat.app.AppCompatActivity;
        import java.io.File;
        import java.io.FileOutputStream;
        import android.util.Base64;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private ValueCallback<Uri[]> mUploadMessage;
            private final static int FILECHOOSER_RESULTCODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                webView = findViewById(R.id.webview);
                WebSettings ws = webView.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                ws.setAllowFileAccess(true);
                ws.setAllowContentAccess(true);
                ws.setAllowFileAccessFromFileURLs(true);
                ws.setAllowUniversalAccessFromFileURLs(true);

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (mUploadMessage != null) mUploadMessage.onReceiveValue(null);
                        mUploadMessage = filePathCallback;
                        
                        // 👇 终极修复：使用 ACTION_OPEN_DOCUMENT 绕过 vivo 系统的限制
                        Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("*/*"); 
                        
                        try {
                            startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                        } catch (Exception e) {
                            mUploadMessage = null;
                            Toast.makeText(MainActivity.this, "打开文件管理器失败", Toast.LENGTH_SHORT).show();
                            return false;
                        }
                        return true;
                    }
                });

                webView.setWebViewClient(new WebViewClient());

                webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                    if (url.startsWith("blob:")) {
                        webView.evaluateJavascript("(function(){" +
                            "var xhr = new XMLHttpRequest();" +
                            "xhr.open('GET', '" + url + "', true);" +
                            "xhr.responseType = 'blob';" +
                            "xhr.onload = function(e) {" +
                            "  if (this.status == 200) {" +
                            "    var blob = this.response;" +
                            "    var reader = new FileReader();" +
                            "    reader.readAsDataURL(blob);" +
                            "    reader.onloadend = function() {" +
                            "      AndroidBridge.saveAndShareFile(reader.result);" +
                            "    }" +
                            "  }" +
                            "};" +
                            "xhr.send();" +
                            "})()", null);
                    }
                });

                webView.addJavascriptInterface(new Object() {
                    @android.webkit.JavascriptInterface
                    public void saveAndShareFile(String base64Data) {
                        try {
                            String pureBase64Encoded = base64Data.substring(base64Data.indexOf(",") + 1);
                            byte[] decodedBytes = Base64.decode(pureBase64Encoded, Base64.DEFAULT);
                            String fileName = "四叶草_备份_" + System.currentTimeMillis() + ".json";
                            File path = getExternalFilesDir(null);
                            File file = new File(path, fileName);
                            FileOutputStream fos = new FileOutputStream(file);
                            fos.write(decodedBytes);
                            fos.close();
                            
                            // 👇 核心：直接调起系统的分享面板（发给微信/QQ）
                            Uri fileUri = androidx.core.content.FileProvider.getUriForFile(
                                MainActivity.this, 
                                getPackageName() + ".fileprovider", 
                                file
                            );
                            
                            Intent shareIntent = new Intent(Intent.ACTION_SEND);
                            shareIntent.setType("application/json");
                            shareIntent.putExtra(Intent.EXTRA_STREAM, fileUri);
                            shareIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                            
                            runOnUiThread(() -> {
                                try {
                                    startActivity(Intent.createChooser(shareIntent, "分享备份文件到..."));
                                } catch (Exception e) {
                                    Toast.makeText(MainActivity.this, "找不到可分享的软件，文件已保存在内部", Toast.LENGTH_LONG).show();
                                }
                            });
                            
                        } catch (Exception e) {
                            runOnUiThread(() -> Toast.makeText(MainActivity.this, "导出失败: " + e.getMessage(), Toast.LENGTH_SHORT).show());
                        }
                    }
                }, "AndroidBridge");

                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                if (requestCode == FILECHOOSER_RESULTCODE) {
                    if (null == mUploadMessage) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK) {
                        if (intent != null && intent.getDataString() != null) {
                            results = new Uri[]{Uri.parse(intent.getDataString())};
                        }
                    }
                    mUploadMessage.onReceiveValue(results);
                    mUploadMessage = null;
                }
            }

            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent">
            <WebView android:id="@+id/webview"
                android:layout_width="match_parent" android:layout_height="match_parent" />
        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        # 写入 provider_paths.xml 用于分享文件
        mkdir -p app/src/main/res/xml
        cat > app/src/main/res/xml/provider_paths.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-files-path name="external_files" path="." />
        </paths>
        EOF

        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.clover.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="四叶草" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.NoActionBar" android:requestLegacyExternalStorage="true">
                
                <provider
                    android:name="androidx.core.content.FileProvider"
                    android:authorities="${applicationId}.fileprovider"
                    android:exported="false"
                    android:grantUriPermissions="true">
                    <meta-data
                        android:name="android.support.FILE_PROVIDER_PATHS"
                        android:resource="@xml/provider_paths" />
                </provider>

                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        if [ -f "icon.png" ]; then cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png; else base64 -d <<< "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" > app/src/main/res/mipmap-hdpi/ic_launcher.png; fi

        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        cat > settings.gradle << 'EOF'
        rootProject.name = "CloverApp"
        include ':app'
        EOF
        
        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.clover.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.clover.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.core:core:1.12.0'
        }
        EOF

        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.5

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Clover-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
