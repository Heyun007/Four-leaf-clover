name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 注意：这里删除了 setup-android 步骤，因为 GitHub 的 Ubuntu 环境已经自带了 Android SDK

    - name: Accept Android SDK Licenses
      run: |
        # 主动接受许可，防止后续构建失败
        yes | sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Create Android Project Structure
      run: |
        # 创建标准的 Android 工程目录结构
        mkdir -p app/src/main/java/com/clover/app
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/layout

        # 1. 拷贝你的网页文件到 assets 目录
        cp index.html app/src/main/assets/ || true
        cp style.css app/src/main/assets/ || true
        cp script.js app/src/main/assets/ || true
        cp manifest.json app/src/main/assets/ || true
        cp sw.js app/src/main/assets/ || true
        if [ -d "stickers" ]; then cp -r stickers app/src/main/assets/; fi

        # 2. 创建 MainActivity.java
        cat > app/src/main/java/com/clover/app/MainActivity.java << 'EOF'
        package com.clover.app;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                webView = findViewById(R.id.webview);
                WebSettings ws = webView.getSettings();
                ws.setJavaScriptEnabled(true);
                ws.setDomStorageEnabled(true);
                ws.setAllowFileAccess(true);
                ws.setAllowContentAccess(true);
                ws.setAllowFileAccessFromFileURLs(true);
                ws.setAllowUniversalAccessFromFileURLs(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/index.html");
            }
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) webView.goBack();
                else super.onBackPressed();
            }
        }
        EOF

        # 3. 创建 activity_main.xml
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent">
            <WebView android:id="@+id/webview"
                android:layout_width="match_parent" android:layout_height="match_parent" />
        </androidx.constraintlayout.widget.ConstraintLayout>
        EOF

        # 4. 创建 AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.clover.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="四叶草" android:supportsRtl="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. 生成占位图标
        base64 -d <<< "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" > app/src/main/res/mipmap-hdpi/ic_launcher.png

        # 6. 创建 Gradle 配置文件
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        cat > settings.gradle << 'EOF'
        rootProject.name = "CloverApp"
        include ':app'
        EOF
        cat > app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.clover.app'
            compileSdk 33
            defaultConfig {
                applicationId "com.clover.app"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

    - name: Build APK with Gradle
      run: |
        # 直接使用系统 gradle 命令构建，避免包装器下载失败
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Clover-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
